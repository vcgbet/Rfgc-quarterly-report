# Render Blueprint — RFGC Quarterly Report System
# Deploy: Render Dashboard → New → Blueprint → point at this repo,
# or create a "Static Site" manually with the settings below.
services:
  - type: web
    name: rfgc-quarterly-report
    runtime: static
    # Single-file app: nothing to build
    buildCommand: echo "Static site - no build step required"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
